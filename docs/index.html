<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online 3D Viewer</title>
    <!-- Load CSS from the Online3DViewer repository -->
    <link rel="stylesheet" href="https://raw.githubusercontent.com/kovacsv/Online3DViewer/master/website/website.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            color: white;
        }
        #viewer {
            width: 90%;
            height: 90%;
            background-color: #000;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <!-- Load JavaScript from the Online3DViewer repository -->
    <script src="https://raw.githubusercontent.com/kovacsv/Online3DViewer/master/website/website.js"></script>
    <script>
        // Initialize the viewer
        const viewerElement = document.getElementById('viewer');
        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model');

        if (modelUrl) {
            const viewer = new OV.EmbeddedViewer(viewerElement);
            viewer.LoadModelFromUrl(modelUrl);
        } else {
            viewerElement.innerHTML = '<p>No model URL provided!</p>';
        }
    </script>
</body>
</html>
