<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer with Interactivity</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333;
            display: flex;
            flex-direction: column;
        }
        #viewer {
            flex: 1;
            background-color: #000;
        }
        #feature-tree {
            width: 100%;
            height: 200px;
            overflow-y: auto;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="feature-tree">
        <h3>Feature Tree</h3>
        <ul id="parts-list"></ul>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.110/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.110/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/jsstp@latest/dist/jsstp.min.js"></script> <!-- For STEP files -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model');
        if (!modelUrl) {
            alert('No model URL provided! Add "?model=<URL_TO_FILE>" to the URL.');
            throw new Error('No model URL provided.');
        }

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 100);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewer').appendChild(renderer.domElement);

        // Orbit controls for rotation, zoom, and pan
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(1, 1, 1).normalize();
        scene.add(light1);

        const light2 = new THREE.AmbientLight(0x404040); // Soft ambient light
        scene.add(light2);

        // Feature tree
        const featureTree = document.getElementById('feature-tree');
        const partsList = document.getElementById('parts-list');

        // Load STL or STEP
        if (modelUrl.endsWith('.stl')) {
            // STL Loader
            const loader = new THREE.STLLoader();
            loader.load(modelUrl, function (geometry) {
                const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                // Center model
                const box = new THREE.Box3().setFromObject(mesh);
                const center = box.getCenter(new THREE.Vector3());
                mesh.position.sub(center);

                // Fit camera
                const size = box.getSize(new THREE.Vector3()).length();
                camera.position.z = size * 1.5;
            });
        } else if (modelUrl.endsWith('.step')) {
            // STEP Loader
            const stepLoader = new JSSTP.STEPReader();
            stepLoader.load(modelUrl).then((stepModel) => {
                // Add parts to scene
                stepModel.children.forEach((child, index) => {
                    scene.add(child);

                    // Add to feature tree
                    const listItem = document.createElement('li');
                    listItem.textContent = `Part ${index + 1}`;
                    listItem.style.cursor = 'pointer';
                    listItem.onclick = () => {
                        child.visible = !child.visible; // Toggle visibility
                    };
                    partsList.appendChild(listItem);
                });

                // Center model
                const box = new THREE.Box3().setFromObject(stepModel);
                const center = box.getCenter(new THREE.Vector3());
                stepModel.position.sub(center);

                // Fit camera
                const size = box.getSize(new THREE.Vector3()).length();
                camera.position.z = size * 1.5;
            });
        } else {
            alert('Unsupported file format! Use .stl or .step.');
            throw new Error('Unsupported file format.');
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Smooth controls
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
