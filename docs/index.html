<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <style>
        /* Adjust the viewer size */
        canvas {
            display: block;
            width: 600px; /* Fixed width */
            height: 400px; /* Fixed height */
            margin: 20px auto;
            border: 2px solid #ccc;
            box-sizing: border-box;
        }

        /* Buttons container */
        #viewer-buttons {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        #viewer-buttons button {
            margin: 5px;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Logo placeholder */
        #logo {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10;
        }

        #logo img {
            width: 100px; /* Adjust the size of your logo */
            height: auto;
        }
    </style>
</head>
<body>
    <!-- Placeholder for your logo -->
    <div id="logo">
        <p>Company Logo</p> <!-- Placeholder text -->
    </div>

    <!-- Buttons for different camera views -->
    <div id="viewer-buttons">
        <button id="front-view">Front View</button>
        <button id="side-view">Side View</button>
        <button id="top-view">Top View</button>
        <button id="bottom-view">Bottom View</button>
        <button id="load-stl">Load STL</button>
        <button id="load-step">Load STEP</button>
    </div>

    <!-- The 3D canvas -->
    <canvas id="3d-viewer"></canvas>

    <!-- Include the Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <!-- Include STL Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/STLLoader.js"></script>
    <!-- Include STEP Worker Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/STEPWorker.js"></script>

    <script>
        // Initialize Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 600 / 400, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('3d-viewer') });
        renderer.setSize(600, 400);
        camera.position.set(5, 5, 5);

        // Add lights
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 10, 10);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
        scene.add(ambientLight);

        // Add orbit controls for interaction
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Render the scene
        const render = function () {
            requestAnimationFrame(render);
            renderer.render(scene, camera);
        };
        render();

        // Define camera positions for each view
        const views = {
            front: { x: 0, y: 0, z: 5 },
            side: { x: 5, y: 0, z: 0 },
            top: { x: 0, y: 5, z: 0 },
            bottom: { x: 0, y: -5, z: 0 },
        };

        // Set camera view function
        function setView(view) {
            const { x, y, z } = views[view];
            camera.position.set(x, y, z);
            camera.lookAt(0, 0, 0);
            controls.update();
        }

        // Add event listeners to buttons
        document.getElementById('front-view').addEventListener('click', () => setView('front'));
        document.getElementById('side-view').addEventListener('click', () => setView('side'));
        document.getElementById('top-view').addEventListener('click', () => setView('top'));
        document.getElementById('bottom-view').addEventListener('click', () => setView('bottom'));

        // Loaders for STL and STEP files
        const stlLoader = new THREE.STLLoader();
        const stepLoader = new THREE.STEPWorkerLoader();

        // Paths to the DOG-AND-DUCK file in both formats
        const stlPath = './docs/DOG-AND-DUCK-V4.stl'; // Adjust the path if necessary
        const stepPath = './docs/DOG-AND-DUCK-V4.step'; // Adjust the path if necessary

        // Load STL file
        document.getElementById('load-stl').addEventListener('click', () => {
            loadSTL(stlPath);
        });

        // Load STEP file
        document.getElementById('load-step').addEventListener('click', () => {
            loadSTEP(stepPath);
        });

        // Function to load STL files
        function loadSTL(path) {
            console.log('Attempting to load STL file from:', path);
            stlLoader.load(
                path,
                (geometry) => {
                    const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
                    const mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
                    console.log('STL file loaded successfully');
                },
                undefined,
                (error) => {
                    console.error('An error occurred while loading the STL file:', error);
                }
            );
        }

        // Function to load STEP files
        function loadSTEP(path) {
            console.log('Attempting to load STEP file from:', path);
            stepLoader.load(
                path,
                (object) => {
                    scene.add(object);
                    console.log('STEP file loaded successfully');
                },
                undefined,
                (error) => {
                    console.error('An error occurred while loading the STEP file:', error);
                }
            );
        }
    </script>
</body>
</html>
