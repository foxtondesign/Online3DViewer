<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online3DViewer</title>
    <!-- Direct references to CSS and JS from the original repository -->
    <link rel="stylesheet" href="https://raw.githubusercontent.com/kovacsv/Online3DViewer/master/website/website.css">
</head>
<body>
    <div id="viewer"></div>
    <script src="https://raw.githubusercontent.com/kovacsv/Online3DViewer/master/website/website.js"></script>
    <script>
        // Initialize the viewer
        const viewer = new OV.EmbeddedViewer(document.getElementById('viewer'));
        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model');
        if (modelUrl) {
            viewer.LoadModelFromUrl(modelUrl);
        }
    </script>
</body>
</html>
