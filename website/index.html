<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@steptools/step-file-reader/dist/step-file-reader.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #viewer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <script>
        // Basic Three.js scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewer').appendChild(renderer.domElement);

        // Add lighting
        const light = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(light);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // Load STEP file
        const stepFileUrl = "https://raw.githubusercontent.com/foxtondesign/MY-3D-MODELS/main/AIRBORNE-FIRE-PIT.step";
        fetch(stepFileUrl)
            .then(response => response.arrayBuffer())
            .then(buffer => {
                const stepReader = new StepFileReader();
                const stepModel = stepReader.read(buffer);

                // Convert STEP to Three.js geometry
                stepModel.shapes.forEach(shape => {
                    const material = new THREE.MeshStandardMaterial({ color: shape.color || 0x999999 });
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(shape.vertices), 3));
                    geometry.setIndex(shape.indices);
                    const mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
                });

                // Auto-center and position the camera
                const boundingBox = new THREE.Box3().setFromObject(scene);
                const center = boundingBox.getCenter(new THREE.Vector3());
                const size = boundingBox.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(center.x, center.y, maxDim * 1.5);
                camera.lookAt(center);
                camera.updateProjectionMatrix();
            })
            .catch(error => console.error('Error loading STEP file:', error));

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
