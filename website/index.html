<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <style>
        /* Style for buttons */
        #viewer-buttons {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
        }
        #viewer-buttons button {
            margin: 5px;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Buttons for different camera views -->
    <div id="viewer-buttons">
        <button id="front-view">Front View</button>
        <button id="side-view">Side View</button>
        <button id="top-view">Top View</button>
        <button id="bottom-view">Bottom View</button>
    </div>

    <!-- The 3D canvas -->
    <canvas id="3d-viewer"></canvas>

    <!-- Include the Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Initialize Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('3d-viewer') });
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.z = 10;

        // Add a sample object (e.g., cube)
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Viewer object
        const viewer = { 
            camera, 
            render: () => renderer.render(scene, camera) 
        };

        // Render the scene
        function animate() {
            requestAnimationFrame(animate);
            viewer.render();
        }
        animate();

        // Define camera positions for each view
        const views = {
            front: { x: 0, y: 0, z: 10 },
            side: { x: 10, y: 0, z: 0 },
            top: { x: 0, y: 10, z: 0 },
            bottom: { x: 0, y: -10, z: 0 },
        };

        // Add event listeners to buttons
        document.getElementById('front-view').addEventListener('click', () => setView('front'));
        document.getElementById('side-view').addEventListener('click', () => setView('side'));
        document.getElementById('top-view').addEventListener('click', () => setView('top'));
        document.getElementById('bottom-view').addEventListener('click', () => setView('bottom'));

        // Set camera view function
        function setView(view) {
            const { x, y, z } = views[view];
            viewer.camera.position.set(x, y, z); // Adjust the camera position
            viewer.camera.lookAt(0, 0, 0); // Ensure the camera looks at the center
            viewer.render(); // Re-render the scene
        }
    </script>
</body>
</html>
