<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxton Design 3D Viewer</title>
    <!-- Include Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <!-- Include STEP Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/loaders/STEPFileLoader.js"></script>
    <!-- Include STL Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
    <div id="viewer" style="width: 100vw; height: 100vh;"></div>

    <script>
        // Initialize Three.js Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewer').appendChild(renderer.domElement);

        // Add Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        // Add Grid Helper (Optional)
        const gridHelper = new THREE.GridHelper(500, 50);
        scene.add(gridHelper);

        // Load Model
        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model');

        if (!modelUrl) {
            alert('No model URL provided! Add ?model=YOUR_MODEL_URL to the URL.');
            throw new Error('No model URL provided!');
        }

        if (modelUrl.toLowerCase().endsWith('.stl')) {
            // Load STL File
            const loader = new THREE.STLLoader();
            loader.load(modelUrl, function (geometry) {
                const material = new THREE.MeshStandardMaterial({ color: 0x555555 });
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);
                camera.position.z = 100;
                animate();
            }, undefined, function (error) {
                console.error('An error occurred loading the STL file:', error);
            });
        } else if (modelUrl.toLowerCase().endsWith('.step') || modelUrl.toLowerCase().endsWith('.stp')) {
            // Load STEP File
            const loader = new THREE.STEPFileLoader();
            loader.load(modelUrl, function (object) {
                scene.add(object);
                camera.position.z = 100;
                animate();
            }, undefined, function (error) {
                console.error('An error occurred loading the STEP file:', error);
            });
        } else {
            alert('Unsupported file format! Use .stl or .step.');
            throw new Error('Unsupported file format.');
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
